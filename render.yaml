services:
  - type: web
    name: negocio-automatico-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: negocio-automatico-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: echo "Static dashboard ready"
    staticPublishPath: .
    plan: free
