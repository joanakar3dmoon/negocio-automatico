services:
  - type: web
    name: negocio-automatico-api
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: negocio-automatico-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

  - type: pserv
    name: negocio-automatico-db
    runtime: postgres
    plan: free
    databaseName: negocio_automatico
    databaseUser: negocio_automatico
